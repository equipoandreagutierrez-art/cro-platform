<style>
:root{
  --bg:#f5f6fa;--panel:#fff;--ink:#101828;--muted:#667085;
  --line:#e4e7ec;--soft:#f2f4f7;--dark:#101828;--blue:#1d4ed8;
  --green:#027a48;--amber:#b54708;--red:#b42318;--purple:#5925dc;
  --radius:16px;--shadow:0 10px 30px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}

/* ── Topbar ── */
.topbar{background:#0b0f1a;color:#fff;padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:3px solid #1d4ed8}
.topbar-brand{font-weight:900;font-size:16px;letter-spacing:-.01em}
.topbar-brand small{font-weight:500;font-size:11px;color:#9aa3b2;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-tag{font-size:11px;color:#9aa3b2;font-weight:600}

button.btn{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;transition:transform .12s;font-size:13px}
button.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--dark);color:#fff}
.btn-secondary{background:#eef2f7;color:var(--ink)}
.btn-white{background:#fff;color:#0b0f1a;border:0;border-radius:8px;padding:8px 16px;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.btn-white:hover{background:#f1f5f9}

/* ── Main ── */
.main{padding:28px 32px 60px;max-width:1200px;margin:0 auto}

/* ── Pills ── */
.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.risk-high{background:#fee4e2;color:var(--red)}
.risk-mid{background:#fef0c7;color:var(--amber)}
.risk-good{background:#dcfae6;color:var(--green)}
.risk-info{background:#e0e7ff;color:var(--purple)}
.risk-neutral{background:#eef2f7;color:#344054}

/* ── Client view header ── */
.client-view-header{background:linear-gradient(135deg,#1e293b 0%,#0b0f1a 100%);color:#fff;border-radius:var(--radius);padding:36px;margin-bottom:24px}
.client-view-header h1{margin:0 0 6px;font-size:32px;letter-spacing:-.03em}
.client-view-header .url{color:#cbd5e1;font-size:14px}
.client-view-header .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}
.client-view-header .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px;backdrop-filter:blur(10px)}
.client-view-header .stat .l{font-size:11px;color:#cbd5e1;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.client-view-header .stat .v{font-size:30px;font-weight:900;letter-spacing:-.04em;margin-top:4px}

/* ── Sections ── */
.client-section{margin-bottom:18px}
.client-section h2{font-size:20px;letter-spacing:-.02em;margin:0 0 14px}

/* ── Category bars ── */
.cat-block{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow)}
.cat-bar{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;cursor:pointer;user-select:none;background:#fff}
.cat-bar:hover{background:#f8f9fc}
.cat-bar .name{font-weight:700}
.cat-breakdown{border-top:1px solid var(--line);display:none}
.dual-bar-wrap{display:flex;flex-direction:column;gap:4px;flex:1;max-width:380px}
.dual-bar-row{display:flex;align-items:center;gap:8px;font-size:11px}
.dual-bar-row .lbl{width:20px;font-size:10px;font-weight:800;opacity:.7}
.dual-bar-row .bar-track{flex:1;height:6px;background:#eef0f5;border-radius:999px;overflow:hidden}
.dual-bar-row .bar-fill-d{height:100%;background:linear-gradient(90deg,#3730a3,#6366f1);border-radius:999px}
.dual-bar-row .bar-fill-m{height:100%;background:linear-gradient(90deg,#9d174d,#ec4899);border-radius:999px}
.dual-bar-row .pct{font-weight:900;min-width:34px;text-align:right;font-size:12px}
.cat-chev{color:var(--muted);transition:transform .2s;display:inline-block}

/* ── Finding cards ── */
.finding-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;border-left:4px solid var(--dark);box-shadow:var(--shadow)}
.finding-card.prio-high{border-left-color:var(--red)}
.finding-card.prio-mid{border-left-color:var(--amber)}
.finding-card.prio-low{border-left-color:#94a3b8}
.finding-card h3{margin:0 0 4px;font-size:16px}
.finding-card .cat{color:var(--purple);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.finding-card .ev{margin:10px 0;color:#344054;font-size:14px}
.finding-card .rec{background:#fbfcff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;font-size:14px}
.finding-card .rec b{color:var(--ink)}
.finding-card .tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.finding-card .tags .pill{font-size:11px}

/* ── Clarity ── */
.clarity-section{margin-top:12px;padding:12px;border-radius:10px;background:#f5f3ff;border:1.5px solid #e0e7ff}
.clarity-badge{display:inline-flex;align-items:center;gap:4px;background:#e0e7ff;color:#3730a3;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
.clarity-metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.clarity-metric-box{background:#fff;border:1px solid #e0e7ff;border-radius:8px;padding:8px 10px;text-align:center}
.clarity-metric-box .cml{font-size:10px;color:#475467;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.clarity-metric-box .cmv{font-size:20px;font-weight:900;color:#3730a3;margin-top:2px;letter-spacing:-.02em}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--dark);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 18px 45px rgba(16,24,40,.25);z-index:200;opacity:0;transform:translateY(10px);transition:.2s}
.toast.show{opacity:1;transform:translateY(0)}

@media(max-width:900px){
  .client-view-header .stats{grid-template-columns:1fr 1fr}
  .main{padding:16px 16px 40px}
  .topbar{padding:0 16px}
  .clarity-metrics-grid{grid-template-columns:1fr 1fr}
}
@media print{
  .topbar{display:none!important}
  body{background:#fff}
  .client-view-header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .finding-card,.cat-block{break-inside:avoid}
}
</style>
</head>

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function priorityLabel(n){ return n>=11?'Alta':n>=8?'Media':'Baja'; }
function priorityClass(n){ return n>=11?'prio-high':n>=8?'prio-mid':'prio-low'; }
function hasClarity(r){ return !!(r&&(r.clarityUrl||r.clarityClickRate||r.clarityDeadClicks||r.clarityRageClicks||r.clarityScrollDepth)); }
function effConfidence(r){ return hasClarity(r)?Math.min(5,Number(r.confidence)+1):Number(r.confidence); }

function computeStats(client){
  let evalD=0,evalM=0,totalD=0,weightsD=0,totalM=0,weightsM=0,totalAll=0,weightsAll=0,qw=0,crit=0;
  const catScores={},catScoresD={},catScoresM={};
  SECTIONS.forEach(s=>{
    let gotD=0,maxD=0,gotM=0,maxM=0;
    s.criteria.forEach((_,i)=>{
      const r=client.criteria[`${s.id}-${i}`];
      if(!r) return;
      const sm=r.scoreMobile??'na';
      if(r.score!=='na'){
        evalD++;gotD+=Number(r.score);maxD+=2;
        const ps=Number(r.impact)+Number(r.severity)+effConfidence(r)-Number(r.effort);
        if(ps>=9&&Number(r.effort)<=2&&Number(r.score)<2) qw++;
        if(Number(r.impact)>=4&&Number(r.severity)>=4&&Number(r.score)===0) crit++;
      }
      if(sm!=='na'){evalM++;gotM+=Number(sm);maxM+=2;}
    });
    const pctD=maxD?Math.round((gotD/maxD)*100):null;
    const pctM=maxM?Math.round((gotM/maxM)*100):null;
    catScoresD[s.id]=pctD; catScoresM[s.id]=pctM;
    if(pctD!==null&&pctM!==null){const avg=Math.round((pctD+pctM)/2);catScores[s.id]=avg;totalAll+=avg*s.weight;weightsAll+=s.weight;}
    else if(pctD!==null){catScores[s.id]=pctD;totalAll+=pctD*s.weight;weightsAll+=s.weight;}
    else if(pctM!==null){catScores[s.id]=pctM;totalAll+=pctM*s.weight;weightsAll+=s.weight;}
    else catScores[s.id]=0;
    if(maxD){totalD+=pctD*s.weight;weightsD+=s.weight;}
    if(maxM){totalM+=pctM*s.weight;weightsM+=s.weight;}
  });
  return{
    score:weightsAll?Math.round(totalAll/weightsAll):0,
    scoreDesktop:weightsD?Math.round(totalD/weightsD):0,
    scoreMobile:weightsM?Math.round(totalM/weightsM):0,
    evaluated:Math.max(evalD,evalM),total:SECTIONS.reduce((a,s)=>a+s.criteria.length,0),
    evalDesktop:evalD,evalMobile:evalM,quickWins:qw,critical:crit,
    catScores,catScoresD,catScoresM
  };
}

function getRows(client){
  const rows=[];
  SECTIONS.forEach(s=>s.criteria.forEach((c,i)=>{
    const cid=`${s.id}-${i}`;
    const r=client.criteria[cid];
    rows.push({cid,sectionId:s.id,section:s.title,source:s.source,weight:s.weight,
      criterion:c[0],question:c[1],defaultRec:c[2],objective:c[3],kpi:c[4],
      ...r,
      priorityScore:Number(r.impact)+Number(r.severity)+Number(r.confidence)-Number(r.effort)
    });
  }));
  return rows;
}

function findingCardHTML(r, isQW){
  return `<div class="finding-card ${priorityClass(r.priorityScore)}">
    <div class="cat">${escapeHtml(r.section)}</div>
    <h3>${escapeHtml(r.criterion)}</h3>
    <div style="color:var(--muted);font-size:13px">${escapeHtml(r.question)}</div>
    ${r.evidence||r.evidenceMobile?`<div class="ev">
      ${r.evidence?`<div><b>🖥 Evidencia Desktop:</b> ${escapeHtml(r.evidence)}</div>`:''}
      ${r.evidenceMobile?`<div style="margin-top:4px"><b>📱 Evidencia Mobile:</b> ${escapeHtml(r.evidenceMobile)}</div>`:''}
    </div>`:''}
    <div class="rec"><b>Recomendación:</b> ${escapeHtml(r.rec||r.defaultRec)}
      ${r.hyp?`<div style="margin-top:8px"><b>Hipótesis:</b> ${escapeHtml(r.hyp)}</div>`:''}
    </div>
    ${hasClarity(r)?`<div class="clarity-section">
      <div style="margin-bottom:8px"><span class="clarity-badge">🔥 Validado con Clarity · Confianza +1</span></div>
      ${(r.clarityClickRate||r.clarityDeadClicks||r.clarityRageClicks||r.clarityScrollDepth)?`<div class="clarity-metrics-grid">
        ${r.clarityClickRate?`<div class="clarity-metric-box"><div class="cml">Click rate</div><div class="cmv">${escapeHtml(r.clarityClickRate)}%</div></div>`:''}
        ${r.clarityDeadClicks?`<div class="clarity-metric-box"><div class="cml">Dead clicks</div><div class="cmv">${escapeHtml(r.clarityDeadClicks)}%</div></div>`:''}
        ${r.clarityRageClicks?`<div class="clarity-metric-box"><div class="cml">Rage clicks</div><div class="cmv">${escapeHtml(r.clarityRageClicks)}%</div></div>`:''}
        ${r.clarityScrollDepth?`<div class="clarity-metric-box"><div class="cml">Scroll depth</div><div class="cmv">${escapeHtml(r.clarityScrollDepth)}%</div></div>`:''}
      </div>`:''}
      ${r.clarityNotes?`<div style="margin-top:8px;font-size:13px;color:#344054">📝 ${escapeHtml(r.clarityNotes)}</div>`:''}
    </div>`:''}
    <div class="tags">
      <span class="pill risk-neutral">Prioridad: ${priorityLabel(r.priorityScore)}</span>
      <span class="pill risk-neutral">KPI: ${escapeHtml(r.kpi)}</span>
      <span class="pill risk-neutral">${escapeHtml(r.status||'Pendiente')}</span>
      ${isQW?'<span class="pill risk-good">⚡ Quick win</span>':''}
    </div>
  </div>`;
}

function render(){
  const stats = computeStats(CLIENT);
  const rows = getRows(CLIENT).filter(r=>r.score!=='na'&&Number(r.score)<2);
  rows.sort((a,b)=>b.priorityScore-a.priorityScore);
  const topFindings = rows.slice(0,8);
  const quickWins = rows.filter(r=>r.priorityScore>=9&&Number(r.effort)<=2).slice(0,4);

  let html = `<div class="client-view-header">
    <h1>${escapeHtml(CLIENT.name)}</h1>
    <div class="url">${escapeHtml(CLIENT.url)} · ${escapeHtml(CLIENT.sector)} · Objetivo: ${escapeHtml(CLIENT.objective)}</div>
    <div class="stats">
      <div class="stat"><div class="l">Score global</div><div class="v">${stats.score}%</div></div>
      <div class="stat"><div class="l">🖥 Desktop</div><div class="v">${stats.scoreDesktop}%</div></div>
      <div class="stat"><div class="l">📱 Mobile</div><div class="v">${stats.scoreMobile}%</div></div>
      <div class="stat"><div class="l">Críticos · Quick wins</div><div class="v">${stats.critical} · ${stats.quickWins}</div></div>
    </div>
  </div>`;

  // Summary by category
  html += `<div class="client-section"><h2>Resumen por categoría</h2>`;
  SECTIONS.forEach(s=>{
    const pct=stats.catScores[s.id]||0;
    const sectionRows=getRows(CLIENT).filter(r=>r.sectionId===s.id&&r.score!=='na');
    const scoreLabel=pct<41?'risk-high':pct<71?'risk-mid':pct<91?'risk-good':'risk-info';
    html+=`<div class="cat-block" id="catblock-${s.id}">
      <div class="cat-bar" onclick="toggleCat('${s.id}')">
        <div class="name">${s.title}</div>
        <div class="dual-bar-wrap">
          <div class="dual-bar-row"><span class="lbl">🖥</span><div class="bar-track"><div class="bar-fill-d" style="width:${stats.catScoresD[s.id]??0}%"></div></div><span class="pct">${stats.catScoresD[s.id]??'—'}%</span></div>
          <div class="dual-bar-row"><span class="lbl">📱</span><div class="bar-track"><div class="bar-fill-m" style="width:${stats.catScoresM[s.id]??0}%"></div></div><span class="pct">${stats.catScoresM[s.id]??'—'}%</span></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-left:12px">
          <span class="pill ${scoreLabel}" style="font-size:11px;white-space:nowrap">${sectionRows.length}/${s.criteria.length}</span>
          <span class="cat-chev" id="chev-${s.id}">▾</span>
        </div>
      </div>
      <div class="cat-breakdown" id="breakdown-${s.id}">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="background:#f8f9fc">
            <th style="padding:8px 14px;text-align:left;color:#475467;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #eef0f5">Criterio</th>
            <th style="padding:8px 14px;text-align:center;color:#3730a3;font-size:11px;text-transform:uppercase;border-bottom:1px solid #eef0f5;white-space:nowrap">🖥 Desktop</th>
            <th style="padding:8px 14px;text-align:center;color:#9d174d;font-size:11px;text-transform:uppercase;border-bottom:1px solid #eef0f5;white-space:nowrap">📱 Mobile</th>
            <th style="padding:8px 14px;text-align:center;color:#475467;font-size:11px;text-transform:uppercase;border-bottom:1px solid #eef0f5">Prioridad</th>
            <th style="padding:8px 14px;text-align:left;color:#475467;font-size:11px;text-transform:uppercase;border-bottom:1px solid #eef0f5">KPI</th>
          </tr></thead>
          <tbody>
            ${s.criteria.map((cr,i)=>{
              const cid=`${s.id}-${i}`;
              const r=CLIENT.criteria[cid];
              const sm=r?(r.scoreMobile??'na'):'na';
              if(!r||(r.score==='na'&&sm==='na')){
                return `<tr style="opacity:.45"><td style="padding:10px 14px;border-bottom:1px solid #eef0f5;font-weight:600">${escapeHtml(cr[0])}</td><td colspan="2" style="padding:10px 14px;border-bottom:1px solid #eef0f5;text-align:center"><span class="pill risk-neutral" style="font-size:11px">Sin evaluar</span></td><td style="padding:10px 14px;border-bottom:1px solid #eef0f5;text-align:center">—</td><td style="padding:10px 14px;border-bottom:1px solid #eef0f5;color:var(--muted)">${escapeHtml(cr[4])}</td></tr>`;
              }
              const scorePill=v=>v==='na'?`<span class="pill risk-neutral" style="font-size:11px">N/A</span>`:Number(v)===0?`<span class="pill risk-high" style="font-size:11px">0 No</span>`:Number(v)===1?`<span class="pill risk-mid" style="font-size:11px">1 Parcial</span>`:`<span class="pill risk-good" style="font-size:11px">2 OK</span>`;
              const ps=Number(r.impact)+Number(r.severity)+Number(r.confidence)-Number(r.effort);
              const pc=ps>=11?'risk-high':ps>=8?'risk-mid':'risk-neutral';
              const ev=r.evidence||'';
              const evm=r.evidenceMobile||'';
              return `<tr style="border-bottom:1px solid #eef0f5">
                <td style="padding:10px 14px">
                  <div style="font-weight:700">${escapeHtml(cr[0])}${hasClarity(r)?' <span class="clarity-badge" style="font-size:10px;padding:2px 6px;vertical-align:middle">🔥</span>':''}</div>
                  ${ev?`<div style="color:#3730a3;font-size:11px;margin-top:3px">🖥 ${escapeHtml(ev)}</div>`:''}
                  ${evm?`<div style="color:#9d174d;font-size:11px;margin-top:2px">📱 ${escapeHtml(evm)}</div>`:''}
                </td>
                <td style="padding:10px 14px;text-align:center">${scorePill(r.score)}</td>
                <td style="padding:10px 14px;text-align:center">${scorePill(sm)}</td>
                <td style="padding:10px 14px;text-align:center"><span class="pill ${pc}" style="font-size:11px">${priorityLabel(ps)}</span></td>
                <td style="padding:10px 14px;color:var(--muted);font-size:12px">${escapeHtml(r.kpi||cr[4])}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  });
  html += `</div>`;

  // Quick wins
  if(quickWins.length){
    html += `<div class="client-section"><h2>⚡ Quick wins recomendados</h2>`;
    quickWins.forEach(r=>html+=findingCardHTML(r,true));
    html += `</div>`;
  }

  // Top findings
  html += `<div class="client-section"><h2>Hallazgos prioritarios</h2>`;
  if(topFindings.length===0){
    html += `<div style="background:#fff;border-radius:14px;padding:30px;text-align:center;color:var(--muted)">No hay hallazgos pendientes.</div>`;
  } else {
    topFindings.forEach(r=>html+=findingCardHTML(r,false));
  }
  html += `</div>`;

  document.getElementById('clientContent').innerHTML = html;
}

function toggleCat(id){
  const bd = document.getElementById('breakdown-'+id);
  const chev = document.getElementById('chev-'+id);
  const open = bd.style.display==='none'||!bd.style.display;
  bd.style.display = open?'table':'none';
  chev.style.transform = open?'rotate(180deg)':'';
}

// ─────────────────────────────────────────────
//  PDF EXPORT
// ─────────────────────────────────────────────
function exportPDF(){
  const stats = computeStats(CLIENT);
  const today = new Date().toLocaleDateString('es-ES');
  const sc = s=>s<41?'#b42318':s<71?'#b54708':s<91?'#027a48':'#1d4ed8';
  const sl = s=>s<41?'Crítico':s<71?'Mejorable':s<91?'Bueno':'Excelente';
  const pill=(t,c)=>`<span style="display:inline-block;background:${c}18;color:${c};border:1px solid ${c}44;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700">${t}</span>`;
  const scoreD=v=>v==='na'?pill('N/A','#667085'):Number(v)===0?pill('0 No','#b42318'):Number(v)===1?pill('1 Parcial','#b54708'):pill('2 OK','#027a48');
  const rows=getRows(CLIENT).filter(r=>r.score!=='na'&&Number(r.score)<2);
  rows.sort((a,b)=>b.priorityScore-a.priorityScore);

  let body=`<div style="page-break-after:always;padding:60px 48px;background:linear-gradient(135deg,#1e293b,#0b0f1a);color:#fff;min-height:calc(100vh - 120px);display:flex;flex-direction:column;justify-content:center">
    <div style="font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;margin-bottom:12px">Informe de Auditoría CRO/UX</div>
    <h1 style="margin:0 0 10px;font-size:42px;font-weight:900;letter-spacing:-.03em">${escapeHtml(CLIENT.name)}</h1>
    <div style="color:#cbd5e1;font-size:16px;margin-bottom:40px">${escapeHtml(CLIENT.url)} · ${escapeHtml(CLIENT.sector)}</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:700px">
      <div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:20px"><div style="font-size:11px;color:#94a3b8;text-transform:uppercase">Score global</div><div style="font-size:36px;font-weight:900;margin-top:6px">${stats.score}%</div><div style="font-size:11px;color:#94a3b8;margin-top:4px">${sl(stats.score)}</div></div>
      <div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:20px"><div style="font-size:11px;color:#94a3b8;text-transform:uppercase">Desktop</div><div style="font-size:36px;font-weight:900;margin-top:6px">${stats.scoreDesktop}%</div></div>
      <div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:20px"><div style="font-size:11px;color:#94a3b8;text-transform:uppercase">Mobile</div><div style="font-size:36px;font-weight:900;margin-top:6px">${stats.scoreMobile}%</div></div>
      <div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:20px"><div style="font-size:11px;color:#94a3b8;text-transform:uppercase">Críticos · QW</div><div style="font-size:36px;font-weight:900;margin-top:6px">${stats.critical} · ${stats.quickWins}</div></div>
    </div>
    <div style="margin-top:auto;padding-top:60px;font-size:13px;color:#475569">Generado el ${today} · Análisis CRO/UX</div>
  </div>`;

  body+=`<div style="page-break-after:always;padding:48px"><h2 style="margin:0 0 24px;font-size:26px;font-weight:900">Resumen por categoría</h2>
    <table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="background:#f8f9fc;border-bottom:2px solid #e4e7ec">
      <th style="padding:10px 14px;text-align:left;font-size:11px;text-transform:uppercase;color:#475467">Categoría</th>
      <th style="padding:10px 14px;text-align:center;font-size:11px;text-transform:uppercase;color:#3730a3">Desktop</th>
      <th style="padding:10px 14px;text-align:center;font-size:11px;text-transform:uppercase;color:#9d174d">Mobile</th>
      <th style="padding:10px 14px;text-align:center;font-size:11px;text-transform:uppercase;color:#475467">Global</th>
      <th style="padding:10px 14px;text-align:center;font-size:11px;text-transform:uppercase;color:#475467">Evaluados</th>
    </tr></thead><tbody>
    ${SECTIONS.map(s=>{
      const pD=stats.catScoresD[s.id]||0,pM=stats.catScoresM[s.id]||0,p=stats.catScores[s.id]||0;
      const ev=getRows(CLIENT).filter(r=>r.sectionId===s.id&&r.score!=='na').length;
      return `<tr style="border-bottom:1px solid #eef0f5"><td style="padding:12px 14px;font-weight:700">${escapeHtml(s.title)}</td>
        <td style="padding:12px 14px;text-align:center"><span style="font-weight:800;color:${sc(pD)}">${pD}%</span></td>
        <td style="padding:12px 14px;text-align:center"><span style="font-weight:800;color:${sc(pM)}">${pM}%</span></td>
        <td style="padding:12px 14px;text-align:center"><span style="font-weight:800;color:${sc(p)}">${p}%</span></td>
        <td style="padding:12px 14px;text-align:center;color:#667085">${ev}/${s.criteria.length}</td></tr>`;
    }).join('')}
    </tbody></table></div>`;

  rows.forEach(r=>{
    const ps=r.priorityScore;
    const bc=ps>=11?'#b42318':ps>=8?'#b54708':'#94a3b8';
    body+=`<div style="break-inside:avoid;border:1px solid #e4e7ec;border-left:4px solid ${bc};border-radius:12px;padding:20px;margin-bottom:16px">
      <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#5925dc;margin-bottom:4px">${escapeHtml(r.section)}</div>
      <h3 style="margin:0 0 6px;font-size:17px">${escapeHtml(r.criterion)}</h3>
      <div style="color:#667085;font-size:13px;margin-bottom:12px">${escapeHtml(r.question)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        🖥 ${scoreD(r.score)} 📱 ${scoreD(r.scoreMobile??'na')}
        ${pill('Prioridad: '+priorityLabel(ps),ps>=11?'#b42318':ps>=8?'#b54708':'#667085')}
      </div>
      ${r.evidence?`<div style="margin-bottom:8px"><b style="font-size:13px">🖥 Evidencia Desktop:</b><br/><span style="font-size:13px;color:#344054">${escapeHtml(r.evidence)}</span></div>`:''}
      ${r.evidenceMobile?`<div style="margin-bottom:8px"><b style="font-size:13px">📱 Evidencia Mobile:</b><br/><span style="font-size:13px;color:#344054">${escapeHtml(r.evidenceMobile)}</span></div>`:''}
      <div style="background:#fbfcff;border:1px solid #e4e7ec;border-radius:8px;padding:12px;font-size:13px">
        <b>Recomendación:</b> ${escapeHtml(r.rec||r.defaultRec)}
        ${r.hyp?`<br/><br/><b>Hipótesis:</b> ${escapeHtml(r.hyp)}`:''}
      </div>
      ${hasClarity(r)?`<div style="margin-top:10px;padding:10px;background:#f5f3ff;border:1px solid #e0e7ff;border-radius:8px;font-size:12px"><b style="color:#3730a3">🔥 Clarity:</b> ${escapeHtml(r.clarityNotes||'')}</div>`:''}
    </div>`;
  });

  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Informe CRO · ${escapeHtml(CLIENT.name)}</title>
    <style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#fff}@page{margin:20mm}@media print{body{background:#fff}}</style></head>
    <body>${body}</body></html>`);
  w.document.close();
  setTimeout(()=>w.print(),600);
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
render();
</script>
